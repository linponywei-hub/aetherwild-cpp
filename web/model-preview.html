<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetherwild 母模型預覽</title><style>body{background:#111c1b;color:#e7ede7;font:16px system-ui;margin:0}header{padding:14px 20px;background:#22352f}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 60px)}aside{padding:20px;background:#1b2926}label{display:block;margin:12px 0}select,input,button{width:100%;padding:10px;background:#31453e;color:white;border:1px solid #638078;border-radius:6px}canvas{display:block;width:100%;height:100%}#viewport{min-height:65vh}small{color:#afc4b9}#status{white-space:pre-wrap} @media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><strong>Aetherwild｜人形母模型預覽器</strong></header><main><aside><label>模型變體<select id="variant"></select></label><label>模型縮放<input id="scale" type="range" min=".1" max="3" step=".05" value="1"></label><label>旋轉角度<input id="yaw" type="range" min="-180" max="180" step="5" value="0"></label><button id="reload">重新載入</button><p id="status">初始化中…</p><small>滑鼠拖曳旋轉視角。此工具只預覽外觀，不會修改 C++ 遊戲規則。未提供 GLB 時顯示錯誤。</small></aside><div id="viewport"></div></main><script type="module" src="/modules/modeling/model-preview.js"></script></body></html>
