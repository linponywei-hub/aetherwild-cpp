name: Optimize Ancient Architecture GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/optimize_architecture.py'
      - '.github/workflows/optimize-architecture.yml'
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Download source asset
        env:
          ASSET_URL: ${{ secrets.AETHERWILD_ARCHITECTURE_GLB_URL }}
        run: |
          test -n "$ASSET_URL" || { echo "Set repository secret AETHERWILD_ARCHITECTURE_GLB_URL to an authorized direct GLB download URL"; exit 1; }
          curl -fL --retry 3 "$ASSET_URL" -o /tmp/ancient-architecture.glb
      - name: Optimize asset
        run: |
          blender --background --factory-startup --python tools/blender/optimize_architecture.py -- /tmp/ancient-architecture.glb output/ancient-architecture-optimized.glb output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-architecture-optimized
          path: output/
          if-no-files-found: error
