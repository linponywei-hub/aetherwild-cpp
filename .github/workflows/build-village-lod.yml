name: Build protected village GLB LOD candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate UV seam protected LOD candidates
        run: blender --background --factory-startup --python-exit-code 1 --python tools/build_village_lod_candidates.py
      - name: Verify ten candidate GLBs
        run: |
          python3 - <<'PY'
          import pathlib,struct,json
          root=pathlib.Path('village-lod-candidates')
          files=list(root.glob('*.glb'))
          assert len(files)==10, f'Expected 10 GLBs, found {len(files)}'
          for file in files:
              data=file.read_bytes()
              assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data),file
          report=json.loads((root/'lod_report.json').read_text())
          assert len(report)==10
          print('Ten candidate LOD files verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: protected-village-lod-candidates
          path: village-lod-candidates/
          retention-days: 14
          if-no-files-found: error
