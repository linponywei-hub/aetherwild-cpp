name: Repair village GLB candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Create candidate GLBs (never overwrite originals)
        run: |
          set -e
          blender --background --factory-startup --python-exit-code 1 --python tools/repair_village_glb.py
      - name: Verify all five valid repaired GLB outputs
        run: |
          python3 - <<'PY'
          import pathlib,struct,json,sys
          source=pathlib.Path('web/assets/models/buildings/village')
          output=pathlib.Path('repaired-village-glb')
          expected=[f'village_building_{i:02d}_lod0.glb' for i in range(1,6)]
          for name in expected:
              original=source/name
              candidate=output/name
              assert original.is_file(), f'Missing source: {original}'
              assert candidate.is_file(), f'Missing repaired output: {candidate}'
              data=candidate.read_bytes()
              assert len(data)>1024 and data[:4]==b'glTF', f'Invalid GLB: {candidate}'
              assert struct.unpack_from('<I',data,8)[0]==len(data), f'Invalid GLB size: {candidate}'
              print(name, 'bytes:', len(data))
          report=output/'repair_report.json'
          assert report.is_file(), 'Missing repair report'
          rows=json.loads(report.read_text())
          assert len(rows)==5, f'Expected 5 reports, got {len(rows)}'
          print('All five repaired GLBs verified.')
          PY
      - name: Upload repaired candidates and diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: repaired-village-glb-candidates
          path: repaired-village-glb/
          retention-days: 14
          if-no-files-found: error
