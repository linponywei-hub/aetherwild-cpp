# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: aetherwild-cpp-test
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: AETHERWILD_PUBLIC
        value: "1"
      - key: AETHERWILD_DATA_DIR
        value: /app/runtime-data
      - key: GAME_OWNER_CODE
        generateValue: true
      - key: GAME_INVITE_CODE
        generateValue: true
